<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css\style.css">
</head>
<body>
    <header>
        <div>
            <div class="logo">
                <img src="img/Logo.svg" alt="logo" class="logo">
            </div>
            <nav>
                <a href="#">Course topics</a>
                <a href="#">What students say</a>
            </nav>
        </div>
        <div class="auth-buttons">
            <a href="#" class="sign-in">Sign in</a>
            <a  href="#" class="get-started-header" >Get started</a>
        </div>
    </header>
    <main>
        <section class="container-learn">
            <div class="container-banner">
                <div class="content-learn-left">
                    <h1>Learn no-code <br> tools today.</h1>
                    <p>Create beautiful webflow sites with flowbase. Clone for <br> free and get started building a site today.</p>
                    <a class="get-started" href="#">Get started</a>
                    <div class="photos-container">
                        <img src="img/man1.png" alt="Student 1" class="photo">
                        <img src="img/man2.png" alt="Student 2" class="photo">
                        <img src="img/man3.png" alt="Student 3" class="photo">
                        <span>Join over 4,000+ students</span>
                    </div>   
                </div>
            </div>
            <div class="video-container">
                <video>
                    <source src="video/sample-video.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </section>
        <div class="stats-container">
            <div class="stat-item">
                <h2>12,201</h2>
                <p>happy students</p>
            </div>
            <div class="stat-item">
                <h2>3,291</h2>
                <p>lectures</p>
            </div>
            <div class="stat-item">
                <h2>1,291</h2>
                <p>5 star reviews</p>
            </div>
        </div>
    </main>
</body>
</html>
